name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r api/requirements.txt -r ingestion/requirements.txt pytest
      - name: Run API tests
        run: pytest tests/api -q
        env:
          PYTHONPATH: api
      - name: Run ingestion tests
        run: pytest tests/ingestion -q
        env:
          PYTHONPATH: ingestion

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose configuration
        run: docker compose config -q
        env:
          NEO4J_PASSWORD: x
          QUERY_API_KEY: x
